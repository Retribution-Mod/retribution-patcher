name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Build binaries
        run: |
          mkdir -p build
          GOOS=darwin GOARCH=amd64 go build -o build/retribution-patcher-mac-amd64
          GOOS=darwin GOARCH=arm64 go build -o build/retribution-patcher-mac-arm64
          GOOS=linux GOARCH=amd64 go build -o build/retribution-patcher-linux-amd64
          GOOS=linux GOARCH=arm64 go build -o build/retribution-patcher-linux-arm64
          GOOS=windows GOARCH=amd64 go build -o build/retribution-patcher-win-amd64.exe

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" build/* LICENSE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
